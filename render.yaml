services:
  - type: web
    name: urban-eye-backend
    env: python
    region: singapore  # closest to India; change to 'oregon' or 'frankfurt' if needed
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app -w 1 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        sync: false   # Set this manually in Render dashboard
      - key: SECRET_KEY
        sync: false   # Set this manually in Render dashboard
      - key: GEMINI_API_KEY
        sync: false   # Set this manually in Render dashboard
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_URL
        sync: false
